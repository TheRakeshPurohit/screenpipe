<svg xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" viewBox="0 0 860 400"><rect width="860" height="400" fill="#fff"/><text x="430" y="30" fill="#000" font-size="15" font-weight="bold" text-anchor="middle">enterprise direct upload — customer-owned S3 (provider s3_bucket)</text><text x="430" y="48" fill="#666" text-anchor="middle">device wire protocol unchanged: same ticket dance as Azure, control plane signs SigV4 instead of SAS</text><rect width="240" height="300" x="30" y="70" fill="#fafafa" stroke="#000" rx="8"/><text x="150" y="92" fill="#000" font-weight="bold" text-anchor="middle">desktop (device)</text><text x="150" y="108" fill="#666" font-size="11" text-anchor="middle">screenpipe-sync TicketedPipeline</text><rect width="240" height="300" x="310" y="70" fill="#fafafa" stroke="#000" rx="8"/><text x="430" y="92" fill="#000" font-weight="bold" text-anchor="middle">screenpi.pe control plane</text><text x="430" y="108" fill="#666" font-size="11" text-anchor="middle">binding: provider=s3_bucket</text><rect width="240" height="300" x="590" y="70" fill="#fafafa" stroke="#000" rx="8"/><text x="710" y="92" fill="#000" font-weight="bold" text-anchor="middle">customer S3 bucket</text><text x="710" y="108" fill="#666" font-size="11" text-anchor="middle">AWS S3 / MinIO / R2 / Wasabi</text><line x1="270" x2="310" y1="150" y2="150" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/><text x="290" y="138" fill="#000" font-size="11" text-anchor="middle">1. POST /upload-ticket</text><text x="290" y="166" fill="#666" font-size="10" text-anchor="middle">manifest only, no body</text><rect width="210" height="76" x="325" y="185" fill="#fff" stroke="#000" rx="6"/><text x="430" y="203" fill="#000" font-size="11" text-anchor="middle">2. SigV4 presign PUT (15 min)</text><text x="430" y="219" fill="#666" font-size="10" text-anchor="middle">x-amz-meta-* pinned as SIGNED</text><text x="430" y="233" fill="#666" font-size="10" text-anchor="middle">headers (not hoisted to query);</text><text x="430" y="247" fill="#666" font-size="10" text-anchor="middle">content-type left unsigned</text><line x1="310" x2="270" y1="285" y2="285" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/><text x="290" y="273" fill="#000" font-size="11" text-anchor="middle">upload_url + headers</text><line x1="270" x2="590" y1="320" y2="320" stroke="#000" stroke-width="2" marker-end="url(#arr)"/><text x="430" y="308" fill="#000" font-size="11" text-anchor="middle">3. PUT body — URL query + headers replayed verbatim</text><text x="430" y="336" fill="#666" font-size="10" text-anchor="middle">readable JSONL or ChaCha20-Poly1305 ciphertext</text><line x1="270" x2="310" y1="352" y2="352" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/><text x="290" y="344" fill="#000" font-size="10" text-anchor="middle">4. complete</text><line x1="550" x2="590" y1="352" y2="352" stroke="#000" stroke-dasharray="4 3" stroke-width="1.5" marker-end="url(#arr)"/><text x="568" y="344" fill="#666" font-size="10" text-anchor="middle">5. HeadObject verify</text><text x="430" y="366" fill="#666" font-size="10" text-anchor="middle">verification skipped for write-only IAM keys (no-read posture): device receipt trusted</text><defs><marker id="arr" markerHeight="8" markerWidth="8" orient="auto" refX="7" refY="4"><path fill="#000" d="M0,0 L8,4 L0,8 z"/></marker></defs></svg>