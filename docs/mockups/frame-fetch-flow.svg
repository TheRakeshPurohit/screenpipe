<svg xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace,Menlo,monospace" font-size="13" viewBox="0 0 880 360"><rect width="880" height="360" fill="#fff"/><text x="20" y="28" fill="#0a0a0a" font-size="16" font-weight="bold">on-demand frame fetch (P3) — lazy push of cited frames</text><text x="20" y="48" fill="#6b7280">SOP cites frame_ids → device ships ONLY those frames, PII-redacted · ~$0.01/mo instead of $3/mo firehose</text><rect width="250" height="90" x="20" y="80" fill="#f7f7f8" stroke="#0a0a0a" rx="6"/><text x="35" y="103" fill="#0a0a0a" font-weight="bold">cloud runner (org VM)</text><text x="35" y="124" fill="#374151">pipe cites frame_ids in SOP steps</text><text x="35" y="142" fill="#374151">writes frame-requests.json</text><text x="35" y="160" fill="#6b7280">≤50 ids/run, per device</text><rect width="230" height="90" x="330" y="80" fill="#f7f7f8" stroke="#0a0a0a" rx="6"/><text x="345" y="103" fill="#0a0a0a" font-weight="bold">control plane</text><text x="345" y="124" fill="#374151">per-device manifest in org store</text><text x="345" y="142" fill="#374151">frame-requests/{lic}/{dev}.json</text><text x="345" y="160" fill="#6b7280">cap 200 pending, oldest dropped</text><rect width="240" height="90" x="620" y="80" fill="#f7f7f8" stroke="#0a0a0a" rx="6"/><text x="635" y="103" fill="#0a0a0a" font-weight="bold">device (next sync tick)</text><text x="635" y="124" fill="#374151">GET /frame-requests → ids</text><text x="635" y="142" fill="#374151">decode local /frames/{id}</text><text x="635" y="160" fill="#374151">downscale ≤1280px ≤300KB</text><line x1="270" x2="330" y1="125" y2="125" stroke="#0a0a0a" stroke-width="1.5" marker-end="url(#a)"/><line x1="560" x2="620" y1="125" y2="125" stroke="#0a0a0a" stroke-width="1.5" marker-end="url(#a)"/><line x1="740" x2="740" y1="170" y2="215" stroke="#0a0a0a" stroke-width="1.5" marker-end="url(#a)"/><text x="752" y="198" fill="#374151">POST /frame-uploads (batch ≤20)</text><rect width="530" height="55" x="330" y="215" fill="#ecfdf5" stroke="#059669" rx="6"/><text x="345" y="237" fill="#065f46" font-weight="bold">org store · frames/{license}/{device}/{frame_id}.jpg</text><text x="345" y="256" fill="#047857">PII-redacted before leaving the device · manifest ids drain on ack</text><rect width="250" height="55" x="20" y="215" fill="#f7f7f8" stroke="#0a0a0a" rx="6"/><text x="35" y="237" fill="#0a0a0a" font-weight="bold">workspace dashboard</text><text x="35" y="256" fill="#374151">SOP step → &lt;img&gt; v1/frames/…</text><line x1="330" x2="270" y1="242" y2="242" stroke="#0a0a0a" stroke-width="1.5" marker-end="url(#a)"/><rect width="840" height="45" x="20" y="295" fill="#fffbeb" stroke="#d97706" rx="6"/><text x="35" y="313" fill="#92400e" font-weight="bold">fail-closed gates</text><text x="35" y="331" fill="#92400e">sync_streams.frame_images default OFF (dashboard toggle) · zero-knowledge/direct-upload orgs always skipped · server re-checks on upload · every failure logged, never breaks telemetry sync</text><defs><marker id="a" markerHeight="8" markerWidth="8" orient="auto" refX="7" refY="4"><path fill="#0a0a0a" d="M0,0 L8,4 L0,8 z"/></marker></defs></svg>