<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" aria-labelledby="title desc" role="img" viewBox="0 0 1200 720"><title id="title">Expected Connections UI after MCP visibility and device-aware sorting</title><desc id="desc">Two Settings Connections states showing MCP servers surfaced first and suggested connections changing based on detected local apps.</desc><style>.bg{fill:#f7f7f4}.panel{fill:#fff;stroke:#d8d8d2;stroke-width:1.5}.soft{fill:#f1f1ec;stroke:#dfdfd8;stroke-width:1}.selected{fill:#eeeeea;stroke:#171717;stroke-width:2}.text{fill:#171717;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif}.muted{fill:#73736c}.tiny{font-size:13px}.small{font-size:15px}.body{font-size:17px}.section,.title{font-weight:650}.title{font-size:28px}.section{font-size:16px}.button{fill:#171717}.buttonText{fill:#fff;font-size:14px;font-weight:650}.outline{fill:#fff;stroke:#cfcfc8;stroke-width:1.2}.dot{fill:#171717}.accent{fill:#ecece6}</style><rect width="1200" height="720" class="bg" rx="24"/><text x="56" y="64" class="text title">Connections: MCP first, then device-aware suggestions</text><text x="56" y="93" class="text muted body">The same screen adapts to what is connected and what is detected on the device.</text><g transform="translate(56 130)"><rect width="520" height="520" class="panel" rx="18"/><text x="28" y="42" class="text section">User A: MCP already configured</text><text x="28" y="66" class="text muted small">Claude, Cursor, and Obsidian are detected locally.</text><rect width="464" height="92" x="28" y="92" class="selected" rx="14"/><circle cx="66" cy="138" r="21" class="accent"/><path stroke="#171717" stroke-linecap="round" stroke-width="2" d="M58 131h16M58 145h16M63 125v9M69 125v9M66 154v-9"/><text x="102" y="128" class="text section">MCP servers</text><circle cx="209" cy="123" r="4" class="dot"/><text x="102" y="153" class="text muted small">2/2 enabled</text><rect width="82" height="34" x="386" y="121" class="outline" rx="8"/><text x="410" y="143" class="text small">Manage</text><text x="28" y="225" class="text section">Suggested for this device</text><g transform="translate(28 246)"><rect width="104" height="96" class="soft" rx="12"/><circle cx="52" cy="32" r="18" class="accent"/><circle cx="84" cy="18" r="4" class="dot"/><text x="52" y="64" class="text tiny" text-anchor="middle">Claude</text><text x="52" y="83" class="text muted tiny" text-anchor="middle">connected</text></g><g transform="translate(148 246)"><rect width="104" height="96" class="soft" rx="12"/><circle cx="52" cy="32" r="18" class="accent"/><text x="52" y="64" class="text tiny" text-anchor="middle">Cursor</text><text x="52" y="83" class="text muted tiny" text-anchor="middle">detected</text></g><g transform="translate(268 246)"><rect width="104" height="96" class="soft" rx="12"/><circle cx="52" cy="32" r="18" class="accent"/><text x="52" y="64" class="text tiny" text-anchor="middle">Obsidian</text><text x="52" y="83" class="text muted tiny" text-anchor="middle">detected</text></g><g transform="translate(388 246)"><rect width="104" height="96" class="soft" rx="12"/><circle cx="52" cy="32" r="18" class="accent"/><text x="52" y="64" class="text tiny" text-anchor="middle">Codex</text><text x="52" y="83" class="text muted tiny" text-anchor="middle">detected</text></g><rect width="464" height="40" x="28" y="374" class="soft" rx="10"/><text x="50" y="399" class="text muted small">Search connections...</text><rect width="220" height="42" x="28" y="430" class="outline" rx="10"/><text x="50" y="457" class="text small">All categories</text><rect width="220" height="42" x="272" y="430" class="outline" rx="10"/><text x="294" y="457" class="text small">Suggested</text></g><g transform="translate(624 130)"><rect width="520" height="520" class="panel" rx="18"/><text x="28" y="42" class="text section">User B: no MCP servers yet</text><text x="28" y="66" class="text muted small">No local AI apps detected, so defaults fill the row.</text><rect width="464" height="92" x="28" y="92" class="panel" rx="14"/><circle cx="66" cy="138" r="21" class="accent"/><path stroke="#171717" stroke-linecap="round" stroke-width="2" d="M58 131h16M58 145h16M63 125v9M69 125v9M66 154v-9"/><text x="102" y="128" class="text section">MCP servers</text><text x="102" y="153" class="text muted small">No servers yet</text><rect width="68" height="34" x="400" y="121" class="button" rx="8"/><text x="420" y="143" class="buttonText">Add</text><text x="28" y="225" class="text section">Suggested for this device</text><g transform="translate(28 246)"><rect width="104" height="96" class="soft" rx="12"/><circle cx="52" cy="32" r="18" class="accent"/><text x="52" y="64" class="text tiny" text-anchor="middle">Custom MCP</text></g><g transform="translate(148 246)"><rect width="104" height="96" class="soft" rx="12"/><circle cx="52" cy="32" r="18" class="accent"/><text x="52" y="64" class="text tiny" text-anchor="middle">Claude</text></g><g transform="translate(268 246)"><rect width="104" height="96" class="soft" rx="12"/><circle cx="52" cy="32" r="18" class="accent"/><text x="52" y="64" class="text tiny" text-anchor="middle">Cursor</text></g><g transform="translate(388 246)"><rect width="104" height="96" class="soft" rx="12"/><circle cx="52" cy="32" r="18" class="accent"/><text x="52" y="64" class="text tiny" text-anchor="middle">Codex</text></g><rect width="464" height="40" x="28" y="374" class="soft" rx="10"/><text x="50" y="399" class="text muted small">Search connections...</text><rect width="220" height="42" x="28" y="430" class="outline" rx="10"/><text x="50" y="457" class="text small">All categories</text><rect width="220" height="42" x="272" y="430" class="outline" rx="10"/><text x="294" y="457" class="text small">Suggested</text></g></svg>